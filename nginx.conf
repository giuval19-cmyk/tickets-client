server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # 1. PROXY PASS VERSO L'API GATEWAY (ms-network)
    # ------------------------------------------------------------------
    # Risolve i resolver DNS interni di Docker in modo dinamico
    resolver 127.0.0.11 valid=30s;

    # Gestione di tutti i microservizi esposti tramite il Gateway
    location ~ ^/(iam-service|support-service|dss-service)/ {
        # Inoltra la richiesta all'API Gateway usando il nome del servizio Docker
        proxy_pass http://api-gateway:8080;

        # Header standard per preservare le informazioni originali della richiesta
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Supporto per WebSocket (se usato da notification-service o simili)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ------------------------------------------------------------------
    # 2. GESTIONE ROUTING ANGULAR (SPA)
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Ottimizzazione caching degli asset statici (JS, CSS, immagini)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Gestione errori
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}